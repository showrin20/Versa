version: '3.8'

services:
  # Backend service for development
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: versa-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
      - backend_data_dev:/app/data
      - /app/venv  # preserve venv inside container
    networks:
      - versa-network-dev
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend service for development
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: versa-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - versa-network-dev
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

networks:
  versa-network-dev:
    driver: bridge

volumes:
  backend_data_dev:
    driver: local
